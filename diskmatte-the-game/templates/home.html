{% extends "base.html" %}

{% block title %}Home | Diskmatte{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Diskmatte the Game</h1>
    <p>Det roliga sättet att läsa TATA65.</p>
</div>
<div class="row g-3">
        {% for app in apps %}
            <div class="col-sm-6 col-lg-4">
                <a class="card h-100 text-decoration-none shadow-sm" href="{{ app.url }}">
                    <div class="card-body">
                        <h2 class="h5 text-dark mb-0">{{ app.name }}</h2>
                    </div>
                </a>
            </div>
        {% endfor %}
</div>
{% endblock %}
