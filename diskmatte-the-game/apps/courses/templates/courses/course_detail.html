<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.name }}</title>
</head>
<body>
    <h1>{{ course.name }}</h1>
    <p>{{ course.description }}</p>

    <h2>Learning sets</h2>
    <ul>
        {% for learning_set in learning_sets %}
            <li>
                <a href="{% url 'courses:learning-set-detail' course.slug learning_set.slug %}">{{ learning_set.name }}</a>
            </li>
        {% empty %}
            <li>No learning sets yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
