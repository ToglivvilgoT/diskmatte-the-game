{% extends "base.html" %}

{% block title %}{{ learning_set.name }} | Diskmatte{% endblock %}

{% block content %}
<div class="page-header">
    <a class="text-decoration-none" href="{% url 'courses:course-detail' course.slug %}">{{ course.name }}</a>
    <h1>{{ learning_set.name }}</h1>
    <p>{{ learning_set.description }}</p>
</div>

<h2 class="h4 mb-3">Tasks</h2>
<div class="list-group shadow-sm">
        {% for task in tasks %}
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="{% url 'tasks:task-detail' course.slug learning_set.slug task.topic.slug task.slug %}">
                <span>{{ task.title }}</span>
                <span class="text-secondary">&rarr;</span>
            </a>
        {% empty %}
            <div class="list-group-item text-secondary">No tasks yet.</div>
        {% endfor %}
</div>
{% endblock %}
