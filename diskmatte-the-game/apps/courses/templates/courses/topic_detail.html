{% extends "base.html" %}

{% block title %}{{ topic.title }} | Diskmatte{% endblock %}

{% block content %}
<div class="page-header">
    <a class="text-decoration-none" href="{% url 'courses:learning-set-detail' course.slug learning_set.slug %}">{{ learning_set.name }}</a>
    <h1>{{ topic.title }}</h1>
    <p>{{ topic.description }}</p>
</div>

<h2 class="h4 mb-3">Tasks</h2>
<div class="list-group shadow-sm">
        {% for task in tasks %}
            <a class="list-group-item list-group-item-action" href="{% url 'tasks:task-detail' course.slug learning_set.slug topic.slug task.slug %}">{{ task.title }}</a>
        {% empty %}
            <div class="list-group-item text-secondary">No tasks yet.</div>
        {% endfor %}
</div>
{% endblock %}
