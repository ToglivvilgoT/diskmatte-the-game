{% extends "base.html" %}

{% block title %}Account | Diskmatte{% endblock %}

{% block content %}
<div class="content-narrow">
    <div class="page-header">
        <h1>Account</h1>
    </div>
    {% if user.is_authenticated %}
        <div class="card shadow-sm">
            <div class="card-body">
                <p class="mb-3">Welcome, <strong>{{ user.username }}</strong>!</p>
                <a class="btn btn-primary" href="{% url 'accounts:logout' %}">Log out</a>
            </div>
        </div>
    {% else %}
        <div class="d-flex gap-2">
            <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>
            <a class="btn btn-outline-primary" href="{% url 'accounts:register' %}">Register</a>
        </div>
    {% endif %}
    <a class="btn btn-link px-0 mt-3" href="{% url 'home' %}">Back to home</a>
</div>
{% endblock %}
