<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accounts</title>
</head>
<body>
    <h1>Accounts</h1>
    {% if user.is_authenticated %}
        <p>Welcome, {{ user.username }}!</p>
        <p><a href="{% url 'accounts:logout' %}">Log out</a></p>
    {% else %}
        <p><a href="{% url 'accounts:login' %}">Log in</a></p>
        <p><a href="{% url 'accounts:register' %}">Register</a></p>
    {% endif %}
    <p><a href="{% url 'home' %}">Back to home</a></p>
</body>
</html>
